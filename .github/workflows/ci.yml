on: push

jobs:
  build-api-dockerimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - run: docker build -t ghcr.io/2chevskii/osustat-api:${{ github.sha }} packages/api
      - run: docker login ghcr.io --username 2chevskii --password ${{ github.token }}
      - run: docker push -t ghcr.io/2chevskii/osustat-api:${{ github.sha }}
    permissions:
      packages: write
