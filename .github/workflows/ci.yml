name: CI

on:
  push:
  pull_request:

env:
  IMAGE_NAME: ghcr.io/2chevskii/osustat-api

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Verify code formatting
        run: npm run format:check

  lint:
    name: Lint source code
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint

  typecheck:
    name: Type-check API
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run API type-check
        run: npm run typecheck

  test:
    name: Run tests
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Execute test suite
        run: npm test

  build:
    name: Build applications
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Build monorepo packages
        run: npm run build

  build_image:
    name: Build API Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build API Docker image
        run: docker build --file packages/api/Dockerfile --tag osustat-api:ci .

  publish-image:
    name: Publish API Docker image
    needs: build_image
    runs-on: ubuntu-latest
    # GitHub does not grant a writable token to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create image tags
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/docker-tags.mjs
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish API Docker image
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: node scripts/ci/publish-image.mjs
